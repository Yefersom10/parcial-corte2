<ion-card>
  <ion-card-header>
    <ion-card-title>Datos del Cliente</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input
        [(ngModel)]="nombre"
        placeholder="Ingrese el nombre"
        required>
      </ion-input>
    </ion-item>

    <ion-item class="contacto-item">
      <ion-label position="stacked">Contacto</ion-label>
      <ion-input
        [(ngModel)]="contacto"
        placeholder="Teléfono o correo"
        required>
      </ion-input>
    </ion-item>
  </ion-card-content>
</ion-card>
